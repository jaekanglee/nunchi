display_information:
  name: Slmmury
  description: 개인용 Slack 대리 응답 도우미
oauth_config:
  scopes:
    user:
      - im:history
      - channels:history
      - chat:write
      - users:read
      - groups:history
      - mpim:history
      - search:read
settings:
  event_subscriptions:
    user_events:
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
